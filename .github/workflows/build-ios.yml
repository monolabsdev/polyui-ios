name: Build unsigned iOS development client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.x

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cocoapods/repos
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-${{ runner.arch }}-ios-deps-${{ hashFiles('bun.lock', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ios-deps-

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Generate fresh iOS project
        run: bunx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: pod install --project-directory=ios
        env:
          RCT_USE_PREBUILT_RNCORE: "0"
          RCT_USE_RN_DEP: "0"

      - name: Resolve workspace and scheme
        run: |
          WORKSPACE=
          for candidate in ios/*.xcworkspace; do
            if test -d "$candidate"; then WORKSPACE="$candidate"; break; fi
          done
          SCHEME_FILE="$(find ios -path '*/xcshareddata/xcschemes/*.xcscheme' ! -path '*/Pods/*' -print | sed -n '1p')"
          test -n "$WORKSPACE" || { echo "::error::No iOS workspace found"; exit 1; }
          test -n "$SCHEME_FILE" || { echo "::error::No shared app scheme found"; exit 1; }
          SCHEME="$(basename "$SCHEME_FILE" .xcscheme)"
          printf 'Workspace: %s\nScheme: %s\n' "$WORKSPACE" "$SCHEME"
          {
            echo "WORKSPACE=$WORKSPACE"
            echo "SCHEME=$SCHEME"
          } >> "$GITHUB_ENV"

      - name: Build unsigned Debug app
        run: |
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify development client
        run: |
          PRODUCT_DIR=build/DerivedData/Build/Products/Debug-iphoneos
          set -- "$PRODUCT_DIR"/*.app
          test "$#" -eq 1 && test -d "$1" ||
            { echo "::error::Expected exactly one Debug-iphoneos app"; exit 1; }
          APP="$1"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          BINARY="$APP/$EXECUTABLE"
          DEV_LAUNCHER_BUNDLE="$(find "$APP" -type d -name 'EXDevLauncher.bundle' -print | sed -n '1p')"
          test -f "$BINARY"
          test ! -f "$APP/main.jsbundle"
          test -d "$DEV_LAUNCHER_BUNDLE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.theoslater.polyuiios"
          test "$(/usr/libexec/PlistBuddy -c 'Print :DEV_CLIENT_TRY_TO_LAUNCH_LAST_BUNDLE' "$APP/Info.plist")" = "false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$APP/Info.plist")" = "true"
          /usr/libexec/PlistBuddy -c 'Print :NSBonjourServices' "$APP/Info.plist" | grep -q '_expo._tcp'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$APP/Info.plist" | grep -q 'exp+polyuiios'
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP/Info.plist"
          printf 'Debug app: %s\nExecutable: %s\n' "$APP" "$BINARY"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (
            cd build/ipa
            zip -qry ../polyui-dev-client-unsigned.ipa Payload
          )

      - uses: actions/upload-artifact@v4
        with:
          name: polyui-dev-client-unsigned-ios
          path: build/polyui-dev-client-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
